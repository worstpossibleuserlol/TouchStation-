name: Build TouchStation debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.xml'
      - '.github/workflows/android-debug-apk.yml'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out TouchStation
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install SDK, CMake and NDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - name: Fetch pinned PCSX-ReARMed source
        run: |
          git clone https://github.com/notaz/pcsx_rearmed.git third_party/pcsx_rearmed
          git -C third_party/pcsx_rearmed checkout 7838055e892061f3f5775ff9f6bb3d3d9c7fe742
          git -C third_party/pcsx_rearmed submodule update --init --recursive

      - name: Build the PS1 core for ARM64 and ARM32
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          set -euo pipefail
          CORE_DIR="$GITHUB_WORKSPACE/third_party/pcsx_rearmed"
          for ABI in arm64-v8a armeabi-v7a; do
            echo "Building PCSX-ReARMed for $ABI"
            (cd "$CORE_DIR/jni" && "$ANDROID_NDK_HOME/ndk-build" -j2 APP_ABI="$ABI" USE_LIBRETRO_VFS=0)
            mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/$ABI"
            cp "$CORE_DIR/jni/libs/$ABI/libretro.so" "$GITHUB_WORKSPACE/app/src/main/jniLibs/$ABI/libpcsx_rearmed.so"
          done
          echo "Bundled core sizes:"
          du -h app/src/main/jniLibs/*/libpcsx_rearmed.so

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Report APK size
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          stat -c 'APK size: %s bytes' "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchStation-1.00-Alpha-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
