name: Build TouchStation debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.xml'
      - '**/*.webp'
      - '.github/workflows/android-debug-apk.yml'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out TouchStation
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install SDK, CMake and NDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - name: Fetch pinned PCSX-ReARMed source
        run: |
          git clone https://github.com/notaz/pcsx_rearmed.git third_party/pcsx_rearmed
          git -C third_party/pcsx_rearmed checkout 7838055e892061f3f5775ff9f6bb3d3d9c7fe742
          git -C third_party/pcsx_rearmed submodule update --init deps/libchdr deps/libretro-common deps/lightning deps/lightrec deps/mman frontend/libpicofe frontend/warm

      - name: Build the PS1 core for ARM and x86 Android
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          ANDROID_NDK_HOME="$SDK_ROOT/ndk/27.2.12479018"
          test -x "$ANDROID_NDK_HOME/ndk-build"
          CORE_DIR="$GITHUB_WORKSPACE/third_party/pcsx_rearmed"
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            echo "Building PCSX-ReARMed for $ABI"
            (cd "$CORE_DIR/jni" && "$ANDROID_NDK_HOME/ndk-build" -j2 APP_ABI="$ABI" USE_LIBRETRO_VFS=0)
            mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/$ABI"
            CORE_SO="$(find "$CORE_DIR" -type f -path "*/$ABI/libretro.so" -print -quit)"
            test -n "$CORE_SO"
            cp "$CORE_SO" "$GITHUB_WORKSPACE/app/src/main/jniLibs/$ABI/libpcsx_rearmed.so"
          done
          echo "Bundled core sizes:"
          du -h app/src/main/jniLibs/*/libpcsx_rearmed.so

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Report APK size
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          stat -c 'APK size: %s bytes' "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchStation-1.00-Alpha-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact from this build
        uses: actions/download-artifact@v4
        with:
          name: TouchStation-1.00-Alpha-APK
          path: downloaded-apk

      - name: Commit APK into releases folder
        run: |
          set -euo pipefail
          APK="$(find downloaded-apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p releases
          cp "$APK" releases/TouchStation-1.00-Alpha.apk
          stat -c 'Repository APK size: %s bytes' releases/TouchStation-1.00-Alpha.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/TouchStation-1.00-Alpha.apk
          if git diff --cached --quiet; then
            echo "APK already matches the repository copy."
            exit 0
          fi
          git commit -m "Add TouchStation 1.00 Alpha APK"
          git push origin HEAD:main

      - name: Create GitHub release and upload APK asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="downloaded-apk/app-debug.apk"
          if [ ! -f "$APK" ]; then
            APK="$(find downloaded-apk -type f -name '*.apk' -print -quit)"
          fi
          test -n "$APK"
          gh release view v1.00-alpha >/dev/null 2>&1 && EXISTS=1 || EXISTS=0
          if [ "$EXISTS" -eq 1 ]; then
            gh release upload v1.00-alpha "$APK" --clobber
          else
            gh release create v1.00-alpha "$APK" \
              --target "$GITHUB_SHA" \
              --title "TouchStation 1.00 Alpha" \
              --notes "TouchStation 1.00 Alpha Android build. Includes the bundled PCSX-ReARMed core for ARM64, ARM32, x86-64 and x86. Import your own legally obtained PS1 BIOS and game files."
          fi
