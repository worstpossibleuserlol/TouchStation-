name: TouchStation PS3 1.0.1 Alpha

on:
  workflow_dispatch:
  push:
    branches: [ ps3-1.0.1-alpha ]
    paths:
      - 'ps3-app/**'
      - 'README.md'
      - 'README-PS3-1.0.1-ALPHA.md'
      - '.github/workflows/touchstation-ps3-1.0.1-alpha.yml'

permissions:
  contents: write

jobs:
  native-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure PPU, SPU, RSX and guest-pipeline tests
        run: cmake -S ps3-app/src/main/cpp -B build/engine -DBUILD_TESTING=ON
      - name: Build and run native engine regression tests
        run: |
          cmake --build build/engine --parallel 2
          ctest --test-dir build/engine --output-on-failure

  android-build:
    needs: native-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android unit tests and build APK
        run: gradle --no-daemon :ps3-app:testDebugUnitTest :ps3-app:assembleDebug
      - name: Verify packaged launcher icon
        run: |
          APK=ps3-app/build/outputs/apk/debug/ps3-app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee build/apk-badging.txt
          grep -q 'application-icon' build/apk-badging.txt
          grep -q 'TouchStation PS3' build/apk-badging.txt
      - name: Report APK size and SHA-256
        run: |
          APK=ps3-app/build/outputs/apk/debug/ps3-app-debug.apk
          stat -c 'TouchStation PS3 1.0.1 Alpha APK: %s bytes' "$APK"
          sha256sum "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchStation-PS3-1.0.1-Alpha
          path: ps3-app/build/outputs/apk/debug/ps3-app-debug.apk
          if-no-files-found: error
      - name: Publish GitHub Alpha prerelease
        if: github.ref == 'refs/heads/ps3-1.0.1-alpha'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-ps3-alpha
          name: TouchStation PS3 1.0.1 Alpha
          prerelease: true
          make_latest: false
          body: |
            TouchStation PS3 1.0.1 Alpha for Android.

            New in 1.0.1:
            - PS3 system software PUP import with streaming copy, SCEUF/header/length/table validation,
              private app storage and SHA-256 fingerprint (no firmware decryption or installation).
            - PPU guest-call to RSX command processing and RGBA frame output.
            - PPU guest-call to SPU WRCH audio mailbox, 48 kHz PCM and Android AudioTrack output.
            - Fullscreen output surface with no touch-control overlay.
            - Supplied TouchStation PS3 logo configured as Android launcher icon using mipmap and
              adaptive-icon resources.
            - Native regression tests and Android PUP parser unit tests.

            This is a development ABI/demo, not the PS3 LV2 syscall ABI. The RSX path remains a CPU
            clear/scissor reference implementation, not a 3D renderer. SPU is a limited subset
            without MFC/DMA. Retail SELF/ISO boot and complete PS3 firmware services are not implemented.
          files: ps3-app/build/outputs/apk/debug/ps3-app-debug.apk
