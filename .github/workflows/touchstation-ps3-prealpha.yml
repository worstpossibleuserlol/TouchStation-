name: TouchStation PS3 1.0.0 Pre-Alpha

on:
  workflow_dispatch:
  push:
    branches: [ ps3-pre-alpha ]
    paths:
      - 'settings.gradle.kts'
      - 'ps3-app/**'
      - 'README-PS3-PRE-ALPHA.md'
      - '.github/workflows/touchstation-ps3-prealpha.yml'

permissions:
  contents: write

concurrency:
  group: touchstation-ps3-prealpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure native PPU tests
        run: cmake -S ps3-app/src/main/cpp -B build/ppu -DBUILD_TESTING=ON
      - name: Build and run PPU tests
        run: |
          cmake --build build/ppu --parallel 2
          ctest --test-dir build/ppu --output-on-failure

  android-build:
    needs: native-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build TouchStation PS3 debug APK
        run: gradle --no-daemon :ps3-app:assembleDebug
      - name: Report APK size
        run: |
          APK=ps3-app/build/outputs/apk/debug/ps3-app-debug.apk
          test -s "$APK"
          stat -c 'TouchStation PS3 APK: %s bytes' "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchStation-PS3-1.0.0-Pre-Alpha
          path: ps3-app/build/outputs/apk/debug/ps3-app-debug.apk
          if-no-files-found: error
      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/ps3-pre-alpha'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ps3-prealpha
          name: TouchStation PS3 1.0.0 Pre-Alpha
          prerelease: true
          make_latest: false
          body: |
            TouchStation PS3 1.0.0 Pre-Alpha.

            This is an Android frontend and experimental PowerPC PPU instruction interpreter foundation.
            It is not yet capable of booting PS3 firmware or commercial PS3 games.

            Includes Bluetooth pairing hand-off, external gamepad detection, a control-free display surface,
            persistent graphics / crop / CPU / SPU / audio / controller settings, per-game profiles,
            and a native PPU smoke test.
          files: ps3-app/build/outputs/apk/debug/ps3-app-debug.apk
