name: Publish TouchStation APK into repository

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Android build run ID"
        required: true
        default: "42013645240"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download successful build artifact
        uses: actions/download-artifact@v4
        with:
          name: TouchStation-1.00-Alpha-APK
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: downloaded-apk

      - name: Verify and stage APK
        run: |
          set -euo pipefail
          APK="$(find downloaded-apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p releases
          cp "$APK" releases/TouchStation-1.00-Alpha.apk
          stat -c 'Repository APK size: %s bytes' releases/TouchStation-1.00-Alpha.apk

      - name: Commit APK to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/TouchStation-1.00-Alpha.apk
          if git diff --cached --quiet; then
            echo "APK is already up to date."
            exit 0
          fi
          git commit -m "Add TouchStation 1.00 Alpha APK"
          git push origin HEAD:main
