name: TouchStation PS3 1.0.0 Alpha

on:
  workflow_dispatch:
  push:
    branches: [ ps3-alpha ]
    paths:
      - 'settings.gradle.kts'
      - 'ps3-app/**'
      - 'README.md'
      - 'README-PS3-ALPHA.md'
      - '.github/workflows/touchstation-ps3-alpha.yml'

permissions:
  contents: write

concurrency:
  group: touchstation-ps3-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure native PPU, SPU and RSX tests
        run: cmake -S ps3-app/src/main/cpp -B build/engine -DBUILD_TESTING=ON
      - name: Build and run native engine tests
        run: |
          cmake --build build/engine --parallel 2
          ctest --test-dir build/engine --output-on-failure

  android-build:
    needs: native-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build TouchStation PS3 Alpha APK
        run: gradle --no-daemon :ps3-app:assembleDebug
      - name: Report APK size
        run: |
          APK=ps3-app/build/outputs/apk/debug/ps3-app-debug.apk
          test -s "$APK"
          stat -c 'TouchStation PS3 APK: %s bytes' "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchStation-PS3-1.0.0-Alpha
          path: ps3-app/build/outputs/apk/debug/ps3-app-debug.apk
          if-no-files-found: error
      - name: Publish GitHub Alpha prerelease
        if: github.ref == 'refs/heads/ps3-alpha'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ps3-alpha
          name: TouchStation PS3 1.0.0 Alpha
          prerelease: true
          make_latest: false
          body: |
            TouchStation PS3 1.0.0 Alpha for Android.

            Includes an experimental PPC64 PPU interpreter and guarded ELF64 homebrew loader,
            a limited SPU vector/integer interpreter and local store, an RSX FIFO/method processor
            with a CPU clear/scissor reference path, Bluetooth controller pairing, per-game profiles,
            display layout and crop settings, and an immersive no-touch-control game display.

            This is not a complete PS3 emulator. Full Cell PPU/SPU support, MFC/DMA, RSX 3D rendering,
            shader pipeline, audio, LV1/LV2 firmware services, encrypted retail SELF and ISO boot
            are not implemented. The ELF boot attempt is experimental and only supports a narrow
            unencrypted big-endian PPC64 ELF subset.
          files: ps3-app/build/outputs/apk/debug/ps3-app-debug.apk
